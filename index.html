<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Реестр покупок</title><style>body{background:#0d1423;color:#f3f6ff;font:16px system-ui;margin:0;padding:24px}main{max-width:950px;margin:auto}h1{font-size:32px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#1b2940;border-radius:14px;padding:18px;flex:1;min-width:100px}.stat b{display:block;font-size:28px}input,button,select{font:inherit;padding:10px;border-radius:9px;border:1px solid #4b5a73;background:#202d44;color:white}input{width:min(350px,90%)}button{cursor:pointer}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}table{width:100%;border-collapse:collapse;background:#172238;border-radius:14px;overflow:hidden}td,th{padding:12px;border-bottom:1px solid #2d3a50;text-align:left}.yes{color:#81e7ad}.no{color:#ff9ca9}.hint{color:#b2bfd3;font-size:13px;line-height:1.5}dialog{background:#172238;color:white;border:1px solid #53637a;border-radius:14px}dialog label{display:block;margin:12px 0}dialog input,dialog select{display:block;width:90%}@media(max-width:550px){body{padding:12px}td,th{padding:9px 5px;font-size:13px}}</style><main><h1>Реестр покупок</h1><p class="hint">Участники и статусы покупок — без сумм оплат</p><div class="stats"><div class="stat">Всего<b id="total"></b></div><div class="stat">Купили<b id="yes"></b></div><div class="stat">Не купили<b id="no"></b></div></div><div class="controls"><input id="q" placeholder="Поиск по имени или ID"><select id="filter"><option value="all">Все</option><option value="1">Купил</option><option value="0">Не купил</option></select><button id="add">+ Добавить</button><button id="csv">Скачать CSV</button></div><div style="overflow:auto"><table><thead><tr><th>№</th><th>Имя</th><th>ID</th><th>Статус</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><p class="hint">Важно: изменения пока сохраняются только в вашем браузере. Для одновременного редактирования всеми участниками требуется общая база данных.</p></main><dialog id="dlg"><form id="form"><h2>Участник</h2><label>Имя<input id="name" required></label><label>ID<input id="uid"></label><label>Статус<select id="status"><option value="0">Не купил</option><option value="1">Купил</option></select></label><button type="submit">Сохранить</button><button type="button" id="cancel">Отмена</button></form></dialog><script>const seed=[["Богдан","wallet_by",0],["Лида","S0DAX_2077",0],["Prince","Grenn69Grenn",0],["Aigerim","",0],["Camila","camila_lawless",1],["Alina","tasamayai",0],["Натали Кан","natali_kang2186",0],["Timofei","markul_tg",1],["Анатолий Тоцкий","AnatoliiTotckii",0],["Artem","hdbel",0],["Tsoy.m","tsoy_maksim",0],["알료나(Алена)","winterbearandsnowflowers",0],["Marina Cherviackova","Marinatcherviackova",1],["Aleksandra Khlopkova","saasha369",1],["Valeriya Googe","valeriya_2391",1],["Olympia","olympiavx",1],["Владислав Рожкин","BOBRelite",1],["Natalia Bitkovskaya","инст: natalybitkovskaya",1],["Mari Kim","инст: ninthapril",0],["Elgareta","инст: elgareta_mkrtchyan",1]];const key="purchases_file_v1";let items;try{items=JSON.parse(localStorage.getItem(key))||seed.map(x=>[...x])}catch{items=seed.map(x=>[...x])}let editIndex=-1;const el=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function save(){localStorage.setItem(key,JSON.stringify(items))}function render(){el("total").textContent=items.length;el("yes").textContent=items.filter(x=>+x[2]===1).length;el("no").textContent=items.filter(x=>+x[2]!==1).length;let q=el("q").value.toLowerCase(),f=el("filter").value;el("rows").innerHTML=items.map((x,i)=>({x,i})).filter(({x})=>(f==="all"||String(x[2])===f)&&(x[0]+" "+x[1]).toLowerCase().includes(q)).map(({x,i})=>'<tr><td>'+(i+1)+'</td><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td><td class="'+(x[2]?'yes':'no')+'">'+(x[2]?'● Купил':'● Не купил')+'</td><td><button data-i="'+i+'">Изменить</button></td></tr>').join("")}el("rows").onclick=e=>{let b=e.target.closest("[data-i]");if(!b)return;editIndex=+b.dataset.i;let x=items[editIndex];el("name").value=x[0];el("uid").value=x[1];el("status").value=x[2];el("dlg").showModal()};el("add").onclick=()=>{editIndex=-1;el("form").reset();el("dlg").showModal()};el("cancel").onclick=()=>el("dlg").close();el("form").onsubmit=e=>{e.preventDefault();let x=[el("name").value.trim(),el("uid").value.trim(),+el("status").value];if(!x[0])return;if(editIndex<0)items.push(x);else items[editIndex]=x;save();render();el("dlg").close()};el("q").oninput=render;el("filter").onchange=render;el("csv").onclick=()=>{let rows=[["Имя","ID","Статус"],...items.map(x=>[x[0],x[1],x[2]?"Купил":"Не купил"])];let csv="\ufeff"+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\r\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="pokupki.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();</script></html>
